[package]
name = "r2t"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
ignore = "0.4"
infer = "0.16"
ptree = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
globset = "0.4.18"

[dev-dependencies]
mockall = "0.13.1"
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
cargo-llvm-cov = "0.6.21"
